[package]
name = "iopole"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Outil en ligne de commande pour interagir avec la plateforme Iopole"
authors = ["Dylan Fevrier <hello@dylanfevrier.com>"]
license = "UNLICENSED"
publish = false
readme = "README.md"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
