[package]
name = "iopole"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Command-line tool for the Iopole platform"
authors = ["Dylan Fevrier <hello@dylanfevrier.com>"]
license = "UNLICENSED"
publish = false
readme = "README.md"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
dialoguer = { version = "0.12.0", default-features = false, features = ["password"] }
etcetera = "0.11.0"
getrandom = "0.4.3"
indicatif = "0.18.6"
jiff = "0.2.38"
rmcp = { version = "3.5.1", features = ["server", "transport-io", "macros"] }
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher"] }
schemars = "1.2.2"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "io-std"] }
ureq = { version = "3.4.2", features = ["json"] }
zeroize = { version = "1.9.1", features = ["derive"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
missing_errors_doc = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true
